<!DOCTYPE html>

<style>
  /* Container holds everything: 2-column thumbnails + 1 main video area */
  .layout-container {
    display: grid;
    grid-template-columns: 200px 1fr; /* Sidebar for thumbs, flexible space for video */
    gap: 20px;
    padding: 20px;
  }

  /* The 1-column grid specifically for the thumbnails */
  .thumbnail-sidebar {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 2 equal columns */
    grid-template-rows: repeat(5, auto);   /* 5 rows */
    gap: 10px;
    align-content: start;
  }

  /* Style for each clickable thumbnail */
  .thumb {
    width: 100%;
    cursor: pointer;
    border-radius: 4px;
    transition: transform 0.2s;
  }
  
  .thumb:hover {
    transform: scale(1.95);
    border: 2px solid #007bff;
  }

  /* Main video area */
  .main-video {
    width: 100%;
    aspect-ratio: 16 / 9;
    background-color: #000;
  }

  /* Mobile responsiveness: stack thumbnails below/above video on small screens */
  @media (max-width: 768px) {
    .layout-container {
      grid-template-columns: 1fr;
    }
    .thumbnail-sidebar {
      grid-template-columns: repeat(5, 1fr); /* Row of 5 on mobile */
    }
  }
</style>
</head>
